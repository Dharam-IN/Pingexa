# ---------------------------------------------------------------------------
# Static serving for the Pingexa SPA.
#
# This server knows nothing about /api — Caddy routes /api/* straight to the API
# container and never reaches here, which keeps the two concerns separate and
# makes it impossible for an SPA fallback to swallow an API 404.
#
# Two cache rules, and they are not interchangeable:
#  * /assets/* filenames are content-hashed by Vite, so they are immutable and
#    can be cached for a year.
#  * index.html is the map to those hashes. If it is cached, a browser keeps
#    asking for the previous deploy's asset names, which no longer exist.
# ---------------------------------------------------------------------------

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS and adds the public security headers; these are the
    # ones that are specific to serving this document.
    add_header X-Content-Type-Options "nosniff" always;

    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Container healthcheck target. Answered without touching the filesystem.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback. /app/monitors/:id, /status/:slug, /verify-email and
    # /reset-password are client-side routes with no file behind them; a browser
    # opening an emailed link lands on one directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
