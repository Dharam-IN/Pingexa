# ---------------------------------------------------------------------------
# Pingexa — PRODUCTION stack for a single server with Caddy on the host.
#
# This file is not the development stack. `docker-compose.dev.yml` provides only
# backing services for local work and is unrelated to this one.
#
# How it fits on the server:
#
#  * Caddy runs in its OWN container (not in this stack) and serves many sites.
#    `web` and `api` join the shared external `caddy` network under the aliases
#    `pingexa-web` and `pingexa-api`, and Caddy proxies to those names. Nothing
#    here publishes a port; create the network once with
#    `docker network create caddy`.
#  * Images are built on the GitHub runner and loaded onto the server by
#    .github/workflows/deploy.yml, which then runs `up -d --no-build`. Never
#    build on the server: it exhausted a small instance's RAM and disk. The
#    `build:` sections below are for building locally.
#  * `migrate` is a one-shot container. `api` and `worker` wait for it to exit
#    0, so a failed migration keeps them from starting on a half-applied schema.
#  * Postgres and Redis sit on a network marked `internal: true` and publish no
#    ports. Use `docker compose exec` to reach them.
#  * Secrets come from `.env.production` beside this file, which is never
#    committed and never copied into an image.
#
# See `docs/DEPLOYMENT.md`.
# ---------------------------------------------------------------------------
name: pingexa

x-app-env: &app-env
  env_file:
    - .env.production
  environment:
    API_HOST: 0.0.0.0
    API_PORT: '4000'
    NODE_ENV: production
    LOG_PRETTY: 'false'

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ---- the SPA -----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: pingexa-web:local
    restart: unless-stopped
    networks:
      # Caddy proxies everything that is not /api/* to pingexa-web:8080.
      caddy:
        aliases: [pingexa-web]
    logging: *logging

  # ---- API ---------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      target: runtime
    image: pingexa-app:local
    restart: unless-stopped
    command: ['node', 'apps/api/dist/server.js']
    <<: *app-env
    networks:
      # Caddy proxies /api/* to pingexa-api:4000. Caddy is the one proxy in
      # front of the API, so TRUST_PROXY_HOPS=1. `backend` for Postgres/Redis.
      caddy:
        aliases: [pingexa-api]
      backend: {}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The API drains in-flight requests and hard-exits at 15s.
    stop_grace_period: 30s
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # ---- worker ------------------------------------------------------------
  worker:
    image: pingexa-app:local
    restart: unless-stopped
    command: ['node', 'apps/api/dist/worker.js']
    <<: *app-env
    networks:
      # `egress` is load-bearing: `backend` is internal:true and has no gateway,
      # so without it the worker could reach neither a monitored site nor the
      # mail provider and every check would fail. The SSRF guard is what keeps
      # those outbound requests off private address space.
      - backend
      - egress
    depends_on:
      # `api` builds the shared image; waiting on it also waits on `migrate`.
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "apps/api/dist/worker.js" > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Worker.close() waits for in-flight checks and hard-exits at 30s.
    stop_grace_period: 45s
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # ---- migrations: one-shot, runs on every `up` and exits ------------------
  # `prisma migrate deploy` applies committed migrations only and skips ones
  # already applied, so running it on every start is safe.
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      target: migrate
    image: pingexa-migrate:local
    restart: 'no'
    env_file:
      - .env.production
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # ---- data services: private, persistent --------------------------------
  postgres:
    # Pinned to the same major as development. A data directory initialised by
    # 17 will not start under 18; that upgrade is a dump and restore.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    volumes:
      # Survives container recreation and `compose down`, but not
      # `docker volume rm` or a lost disk. It is not a backup.
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    security_opt: ['no-new-privileges:true']
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction is not a tuning choice: BullMQ silently loses jobs if Redis
    # evicts job keys under memory pressure. The password is read from the
    # environment so it does not show up in `docker inspect` argv.
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    security_opt: ['no-new-privileges:true']
    logging: *logging

networks:
  # Shared with the Caddy container and other sites. Aliases are prefixed with
  # `pingexa-` because plain `web`/`api` would collide with other stacks here.
  caddy:
    external: true
  # `internal: true` removes the gateway: nothing here can reach the internet
  # and nothing on the internet can reach it.
  backend:
    driver: bridge
    internal: true
  # Outbound only, for the worker's checks and SMTP.
  egress:
    driver: bridge

volumes:
  pgdata:
    name: pingexa_pgdata
  redisdata:
    name: pingexa_redisdata
