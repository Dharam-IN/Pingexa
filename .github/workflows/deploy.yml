# ---------------------------------------------------------------------------
# Continuous deployment to the EC2 server.
#
# Runs after CI succeeds on main (and can be started by hand from the Actions
# tab). It builds the three images HERE, on the GitHub runner, streams them to
# the server over SSH with `docker save | docker load`, copies
# docker-compose.prod.yml to /opt/pingexa, restarts the stack, and fails the run
# if the API does not report ready. See docs/DEPLOYMENT.md.
#
# Never build on the server: three parallel `npm ci` runs exhausted a small
# instance's RAM and disk and made it unreachable, SSH included. The server only
# loads finished images. No registry, no git and no GitHub access needed there.
#
# Repository secrets:
#   DEPLOY_HOST         EC2 public IP or hostname
#   DEPLOY_USER         deploy
#   DEPLOY_SSH_KEY      private key whose public half is in
#                       ~deploy/.ssh/authorized_keys on the server
#   DEPLOY_KNOWN_HOSTS  optional; output of `ssh-keyscan <host>`. Without it the
#                       host key is fetched at run time, which trusts the first
#                       answer.
# ---------------------------------------------------------------------------
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits rather than cancelling a half-done one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    # Only after a successful CI run from a push to main, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    env:
      # The commit CI tested, not whatever main points at by now.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # Tags match the `image:` names in docker-compose.prod.yml, so compose uses
      # them as-is. The runner is linux/amd64, like the server; the argon2
      # native addon must match the server's architecture.
      - name: Build images
        run: |
          docker build -f deploy/Dockerfile.app --target runtime -t pingexa-app:local .
          docker build -f deploy/Dockerfile.app --target migrate -t pingexa-migrate:local .
          docker build -f deploy/Dockerfile.web -t pingexa-web:local .

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Send images and compose file to the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30"
          # ~300 MB compressed. Layers the server already has are skipped by
          # `docker load`, but the stream itself is always the full set.
          docker save pingexa-app:local pingexa-migrate:local pingexa-web:local \
            | gzip -1 \
            | $SSH "$USER@$HOST" 'gunzip | docker load'
          # The only file the server needs. .env.production stays untouched.
          scp -i ~/.ssh/deploy_key -o BatchMode=yes docker-compose.prod.yml "$USER@$HOST:/opt/pingexa/docker-compose.prod.yml"

      - name: Restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" "bash -s" -- "$SHA" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          cd /opt/pingexa
          test -f .env.production || { echo "missing /opt/pingexa/.env.production" >&2; exit 1; }

          # The network shared with the Caddy container. Created once.
          docker network inspect caddy > /dev/null 2>&1 || docker network create caddy

          echo "==> Starting (migrations run first)"
          # --no-build: the images were just loaded. Building here is what
          # took the server down once.
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build --remove-orphans

          echo "==> Waiting for /api/ready"
          # Asked from inside the api container: no port is published.
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api \
                node -e "fetch('http://127.0.0.1:4000/api/ready').then(async r=>{console.log(await r.text());process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"; then
              echo
              echo "==> Deployed $SHA"
              docker image prune -f > /dev/null
              exit 0
            fi
            sleep 4
          done

          echo "API not ready after 2 minutes" >&2
          docker compose -f docker-compose.prod.yml --env-file .env.production ps -a
          docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=50 migrate api worker
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
