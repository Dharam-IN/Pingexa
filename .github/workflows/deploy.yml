# ---------------------------------------------------------------------------
# Continuous deployment to the EC2 server.
#
# Runs after CI succeeds on main (and can be started by hand from the Actions
# tab). It checks out the exact commit CI tested, copies it to /opt/pingexa on
# the server with rsync as the `deploy` user, rebuilds and restarts the stack
# there, and fails the run if the API does not report ready. The server needs
# no git and no GitHub access. See docs/DEPLOYMENT.md.
#
# Repository secrets:
#   DEPLOY_HOST         EC2 public IP or hostname
#   DEPLOY_USER         deploy
#   DEPLOY_SSH_KEY      private key whose public half is in
#                       ~deploy/.ssh/authorized_keys on the server
#   DEPLOY_KNOWN_HOSTS  optional; output of `ssh-keyscan <host>`. Without it the
#                       host key is fetched at run time, which trusts the first
#                       answer.
# ---------------------------------------------------------------------------
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits rather than cancelling a half-done one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    # Only after a successful CI run from a push to main, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    env:
      # The commit CI tested, not whatever main points at by now.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Copy code to the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # --delete removes files that no longer exist in the repo, so the
          # server always matches this commit. .env.production lives only on
          # the server and is excluded from both copying and deletion.
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env.production' \
            -e "ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes" \
            ./ "$USER@$HOST:/opt/pingexa/"

      - name: Build and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" "bash -s" -- "$SHA" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          cd /opt/pingexa
          test -f .env.production || { echo "missing /opt/pingexa/.env.production" >&2; exit 1; }

          # The network shared with the Caddy container. Created once.
          docker network inspect caddy > /dev/null 2>&1 || docker network create caddy

          echo "==> Building and starting (migrations run first)"
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --remove-orphans

          echo "==> Waiting for /api/ready"
          # Asked from inside the api container: no port is published.
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api \
                node -e "fetch('http://127.0.0.1:4000/api/ready').then(async r=>{console.log(await r.text());process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"; then
              echo
              echo "==> Deployed $SHA"
              docker image prune -f > /dev/null
              exit 0
            fi
            sleep 4
          done

          echo "API not ready after 2 minutes" >&2
          docker compose -f docker-compose.prod.yml --env-file .env.production ps -a
          docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=50 migrate api worker
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
